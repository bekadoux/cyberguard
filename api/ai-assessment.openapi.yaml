openapi: 3.1.0
info:
  title: CyberGuard AI Assessment API
  version: 0.1.0
  description: |
    Proposed read-only AI assessment API. Intended behind same-origin Caddy /ai.
    Go owns login and checks current role and incident access on every read.
    This contract is subject to architect/Go developer review.
servers:
  - url: /ai
paths:
  /healthz:
    get:
      summary: AI process liveness (not model readiness)
      responses:
        '200':
          description: Process running
  /readyz:
    get:
      summary: AI database connection readiness only
      responses:
        '200':
          description: Connected to incident database
        '503':
          description: Database inaccessible
  /incidents/{incident_id}/assessment:
    get:
      summary: Read original assessment job and stored result
      description: |
        Requires existing Go HttpOnly session and analyst/admin role, plus
        current incident access. Returns a null result for queued/running/failed jobs.
        Analysts/admins may read AI output on their own reports. Employees cannot read AI output.
        Does not cause inference or write incident fields.
      parameters:
        - in: path
          name: incident_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Assessment status and saved result, when available
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                type: object
                required: [job, result]
                properties:
                  job:
                    type: object
                    required: [id, incident_id, status, kind, attempt_count]
                    properties:
                      id: {type: string, format: uuid}
                      incident_id: {type: string, format: uuid}
                      kind: {type: string}
                      status: {type: string, enum: [queued, running, completed, failed]}
                      attempt_count: {type: integer}
                      error_code: {type: [string, 'null']}
                  result:
                    oneOf:
                      - type: 'null'
                      - type: object
                        required: [assessment, source_kind, created_at]
                        properties:
                          assessment:
                            $ref: '#/components/schemas/StoredAssessment'
                          source_kind: {type: string, enum: [fake, kev_llm]}
                          created_at: {type: string, format: date-time}
        '401': {description: Missing or expired login}
        '403': {description: Caller does not have the analyst or admin role}
        '404': {description: Incident inaccessible or job not found}
        '503': {description: Go or incident database unavailable}

components:
  schemas:
    StoredAssessment:
      type: object
      description: |
        Stored advisory output. New Kev assessments report the eight domain-rubric
        indicators. Previously stored immutable results may contain earlier signal
        codes, so reads must tolerate that history. Probabilities are uncalibrated;
        no score changes the human-confirmed category or severity.
      required: [schema_version, is_fake, triage, brief, disclaimer]
      properties:
        schema_version: {type: string, const: '1.0'}
        is_fake: {type: boolean}
        disclaimer: {type: string}
        triage:
          type: object
          required: [model, suggested_category, category_probabilities, indicator_probabilities, needs_human_review]
          properties:
            model: {type: string}
            suggested_category:
              type: [string, 'null']
              enum: [phishing, malware, account_compromise, data_exposure, lost_device, policy_violation, service_disruption, null]
              description: 'null means abstention; `other` is not suggested.'
            category_probabilities:
              type: object
              additionalProperties: {type: number, minimum: 0, maximum: 1}
            indicator_probabilities:
              type: object
              description: |
                New real assessments use the eight current keys below. Historical
                results use credentials_entered with the legacy keys
                clicked_suspicious_link, files_encrypted and unauthorized_access.
                Both rubrics use schema version 1.0; readers should not combine
                scores from the two rubrics. A missing score does not imply
                the event did not occur. Labelled fake results may have no scores.
              properties:
                clicked_link: {type: number, minimum: 0, maximum: 1}
                credentials_entered:
                  type: number
                  minimum: 0
                  maximum: 1
                  description: |
                    In the current rubric, a password or authentication code was
                    entered. In the legacy rubric, credentials were entered into
                    a suspicious form. If this is the only key, the frontend
                    conservatively uses the legacy meaning.
                attachment_opened: {type: number, minimum: 0, maximum: 1}
                payment_made: {type: number, minimum: 0, maximum: 1}
                data_sent_out: {type: number, minimum: 0, maximum: 1}
                device_abnormal: {type: number, minimum: 0, maximum: 1}
                multiple_affected: {type: number, minimum: 0, maximum: 1}
                ongoing: {type: number, minimum: 0, maximum: 1}
                clicked_suspicious_link: {type: number, minimum: 0, maximum: 1}
                files_encrypted: {type: number, minimum: 0, maximum: 1}
                unauthorized_access: {type: number, minimum: 0, maximum: 1}
              additionalProperties: {type: number, minimum: 0, maximum: 1}
            potential_impact: {type: [number, 'null'], minimum: 0, maximum: 3}
            raw_model_confidence: {type: [number, 'null']}
            needs_human_review: {type: boolean}
        brief:
          type: object
          required: [summary, reported_facts, unknowns, follow_up_questions, suggested_steps]
          properties:
            summary: {type: string}
            reported_facts: {type: array, items: {type: string}}
            unknowns: {type: array, items: {type: string}}
            follow_up_questions: {type: array, items: {type: string}}
            suggested_steps:
              type: array
              items: {type: string}
              description: 'Derived only from the approved playbooks, not generated by the LLM.'
