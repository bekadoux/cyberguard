openapi: 3.1.0
info:
  title: CyberGuard Investigation, Administration and Notification API
  version: 0.2.0
  description: |
    Candidate implementation of the remaining Go backend handoff. All browser
    endpoints require a current HttpOnly session; authorization uses current
    identity records and server-side ownership/assignment checks.
servers:
  - url: /api
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-cyberguard_session
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
    Comment:
      type: object
      required: [id, author_id, visibility, text, created_at]
      properties:
        id: {type: string, format: uuid}
        author_id: {type: string, format: uuid}
        visibility: {type: string, enum: [public, internal]}
        text: {type: string, maxLength: 5000}
        created_at: {type: string, format: date-time}
    User:
      type: object
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        role: {type: string, enum: [employee, analyst, admin]}
        is_blocked: {type: boolean}
    NewPassword:
      type: string
      writeOnly: true
      maxLength: 128
      description: Nonblank, NUL-free text of 12 to 128 UTF-8 bytes. JSON Schema string lengths alone cannot express the byte limits.
security:
  - sessionCookie: []
paths:
  /incidents/{id}/timeline:
    get:
      operationId: listReporterTimeline
      summary: Read an incident's status timeline as its reporter
      description: >-
        The authenticated reporter of a non-archived incident, regardless of role,
        receives status and time only, newest first. The cursor is scoped to the
        incident and does not grant access. The submission timestamp is always recorded;
        older transitions lacking a reliable source are not reconstructed.
        Staff action history is separate.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {in: query, name: cursor, schema: {type: string, minLength: 1, maxLength: 256}}
      responses:
        '200':
          description: Status timeline page. No audit metadata or AI data.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [events, next_cursor]
                properties:
                  events:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required: [status, occurred_at]
                      properties:
                        status:
                          $ref: './go-incidents.openapi.yaml#/components/schemas/IncidentStatus'
                        occurred_at: {type: string, format: date-time, description: UTC RFC 3339}
                  next_cursor: {type: [string, 'null']}
        '400': {description: Invalid or unsupported query parameter or cursor}
        '401': {description: Missing or invalid session}
        '404': {description: 'Incident missing, malformed, not owned by the caller, or archived'}
        '503': {description: Session or incident dependency unavailable}
  /incidents/{id}/claim:
    post:
      summary: Atomically claim an unassigned submitted incident
      description: Active analyst or admin; only the first concurrent claim succeeds.
      parameters: &incident_id
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: 'Assigned to caller, status becomes triage'}
        '401': {description: Session required}
        '403': {description: Professional role required}
        '404': {description: Incident not found}
        '409': {description: Already assigned or not submitted}
  /incidents/{id}/assign:
    post:
      summary: Admin assigns/reassigns a currently active incident
      parameters: *incident_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [analyst_id]
              additionalProperties: false
              properties:
                analyst_id: {type: string, format: uuid}
      responses:
        '200': {description: Assigned to active analyst}
        '403': {description: Admin role required}
        '404': {description: Incident not found}
        '409': {description: Ineligible incident status}
  /incidents/{id}/fields:
    patch:
      summary: Edit approved incident fields
      description: |
        Assigned analyst or admin only. Original title/description are immutable.
        Category/severity are confirmed human decisions, not automatically applied AI output.
      parameters: *incident_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                category:
                  type: [string, 'null']
                  enum: [phishing, malware, account_compromise, data_exposure, lost_device, policy_violation, service_disruption, other, null]
                severity:
                  type: [string, 'null']
                  enum: [low, medium, high, critical, null]
                affected_system: {type: [string, 'null'], maxLength: 500}
                resolution_note: {type: [string, 'null'], maxLength: 10000}
      responses:
        '200': {description: Fields updated and action recorded}
        '400': {description: Invalid or immutable field}
        '403': {description: Assigned analyst or admin required}
        '409': {description: Ineligible incident status}
  /incidents/{id}/transition:
    post:
      summary: Perform a permitted incident status transition
      description: |
        The transition graph is enforced under a row lock. A reporter can
        confirm resolution or request review; an admin can reopen terminal cases.
        Each transition to awaiting_reporter requires a fresh unanswered public
        question. A public reporter reply (not an internal note) resumes investigating
        from awaiting_reporter or resolved. A formal review request notifies the
        assignee and clears the closure timer. Manual submitted → triage is unavailable;
        it happens on claim/assignment. False positive and reopening require reasons.
      parameters: *incident_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status:
                  type: string
                  enum: [triage, investigating, awaiting_reporter, resolved, closed, false_positive]
                reason: {type: string, maxLength: 2000}
      responses:
        '200': {description: Transition committed and action recorded}
        '403': {description: Transition not allowed for this actor}
        '409': {description: Required fields or comments missing}
  /incidents/{id}/archive:
    post:
      summary: Admin archives an incident without deleting data
      parameters: *incident_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '200': {description: Incident archived and audited}
        '403': {description: Admin role required}
  /incidents/{id}/comments:
    get:
      summary: Read authorized comments
      description: Employees see only public comments; analysts/admins see both types. Returns the latest 500 visible entries in chronological order.
      parameters: *incident_id
      responses:
        '200':
          description: Comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items: {$ref: '#/components/schemas/Comment'}
        '404': {description: Missing or inaccessible incident}
    post:
      summary: Add a public or internal comment
      description: |
        Reporter may reply publicly on own incident; unassigned analysts may
        post internally but only assigned analysts/admin may post publicly
        on the professional side. A reporter public reply reopens a resolved incident
        or resumes one awaiting the reporter; the assigned analyst is notified.
      parameters: *incident_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, visibility]
              additionalProperties: false
              properties:
                text: {type: string, minLength: 1, maxLength: 5000}
                visibility: {type: string, enum: [public, internal]}
      responses:
        '201': {description: 'Comment created, history and notifications updated'}
        '403': {description: Visibility/assignment forbidden}
  /incidents/{id}/history:
    get:
      summary: Read incident action history
      description: Professional roles only; latest 500 append-only events in chronological order. Admins may review archived incident history by ID.
      parameters: *incident_id
      responses:
        '200': {description: Action history}
        '403': {description: Professional role required}
  /notifications:
    get:
      summary: List own recent incident notifications
      description: Incident-linked notifications and their read/unread actions require current access to the non-archived incident.
      responses:
        '200': {description: 'Own notifications only, max 100 records'}
  /notifications/{id}/read:
    post:
      summary: Mark own notification read
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Read timestamp saved}
        '404': {description: Not the user's notification or missing}
  /admin/users:
    get:
      summary: Admin lists users (without credentials/hashes)
      description: Filters apply before pagination. Results are ordered by username. Start a new traversal when changing filters.
      parameters:
        - {in: query, name: eligible, schema: {type: string, enum: [analyst]}, description: Return only active analysts eligible for assignment.}
        - {in: query, name: q, schema: {type: string, maxLength: 64}, description: Case-insensitive literal username prefix.}
        - {in: query, name: cursor, schema: {type: string}, description: The next_cursor from the previous page.}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 500, default: 500}}
      responses:
        '200':
          description: One directory page
          content:
            application/json:
              schema:
                type: object
                required: [users, next_cursor]
                properties:
                  users: {type: array, items: {$ref: '#/components/schemas/User'}}
                  next_cursor: {type: [string, 'null']}
        '400': {description: 'Invalid filter, cursor or page size'}
        '403': {description: Admin role required}
    post:
      summary: Admin creates an employee account
      description: Use the separate role change operation to promote an existing account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              additionalProperties: false
              properties:
                username: {type: string, minLength: 3, maxLength: 128, description: Maximum 128 UTF-8 bytes before normalization; normalized username is 3–64 ASCII characters.}
                password: {$ref: '#/components/schemas/NewPassword'}
                role: {type: [string, 'null'], enum: [employee, null], description: Optional legacy field. The role is always employee.}
      responses:
        '201': {description: Account created; password never returned}
        '400': {description: Invalid credentials or requested non-employee role}
        '409': {description: Username already exists}
  /admin/users/{id}/role:
    post:
      summary: Admin updates another user's role and revokes old sessions
      parameters: *incident_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role: {type: string, enum: [employee, analyst, admin]}
                reason: {type: string, maxLength: 1000, description: Optional non-secret audit reason}
      responses:
        '200': {description: Role updated and auth_version incremented}
        '403': {description: Admin role required or owner_protected}
        '409': {description: Cannot change own role or remove the last active admin}
  /admin/users/{id}/block:
    post:
      summary: Admin blocks/unblocks another user and revokes old sessions
      parameters: *incident_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocked]
              additionalProperties: false
              properties:
                blocked: {type: boolean}
                reason: {type: string, maxLength: 1000, description: Optional non-secret audit reason}
      responses:
        '200': {description: Block flag updated and auth_version incremented}
        '403': {description: Admin role required or owner_protected}
        '409': {description: Cannot block/unblock self or remove the last active admin}
  /admin/users/{id}/password:
    post:
      summary: Admin resets password with Argon2id and revokes old sessions
      parameters: *incident_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              additionalProperties: false
              properties:
                password: {$ref: '#/components/schemas/NewPassword'}
                current_password: {type: string, format: password, maxLength: 128, description: Required when the owner changes their own password. Other admins may not reset the owner's password.}
                reason: {type: string, maxLength: 1000, description: Optional non-secret audit reason}
      responses:
        '200': {description: Password reset; no hash or password returned}
        '403': {description: 'Admin role required, owner_protected, or invalid_confirmation'}
        '429': {description: confirmation_rate_limited; Retry-After is supplied}
  /admin/audit:
    get:
      summary: Admin reads user administration audit (incident history is separate)
      responses:
        '200': {description: Last 500 identity events; no credential content}
        '403': {description: Admin role required}
  /admin/demo-incidents:
    get:
      summary: Read demo incident availability for the Admin page
      responses:
        '200':
          description: Remaining counts unused bundled scenarios; zero when disabled.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, remaining]
                properties:
                  enabled: {type: boolean}
                  remaining: {type: integer, minimum: 0}
        '400': {description: Unexpected query parameters}
        '401': {description: Session required}
        '403': {description: Admin role required}
        '503': {description: Incident storage unavailable}
    post:
      summary: Add up to ten unused synthetic demo incidents
      description: |
        Requires DEMO_INCIDENTS_ENABLED=true and a current admin. Randomly selects
        up to ten previously unused bundled scenarios, or all remaining if fewer.
        Reports are distributed across the three active provisioned demo reporters.
        Scenario IDs, incidents, normal initial snapshots and AI jobs, and audit
        events commit atomically. Each scenario can be added only once per database.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200':
          description: No unused scenarios remain
          content:
            application/json:
              schema:
                type: object
                required: [created, remaining]
                properties:
                  created: {const: 0}
                  remaining: {const: 0}
        '201':
          description: Reports and jobs created
          content:
            application/json:
              schema:
                type: object
                required: [created, remaining]
                properties:
                  created: {type: integer, minimum: 1, maximum: 10}
                  remaining: {type: integer, minimum: 0}
        '400': {description: Expected an empty object and no query parameters}
        '401': {description: Session required or account authorization changed}
        '403': {description: Admin role required or rejected browser origin}
        '404': {description: Demo incident creation is disabled}
        '409': {description: demo_accounts_unavailable; a required demo reporter is missing or ineligible}
        '415': {description: Content-Type must be application/json}
        '503': {description: Identity or incident storage unavailable}
  /admin/ownership:
    get:
      summary: Read the current owner ID
      responses:
        '200':
          description: Owner UUID, or null until the operator initializes ownership.
          content:
            application/json:
              schema: &ownership_response
                type: object
                required: [owner_id]
                additionalProperties: false
                properties:
                  owner_id: {type: [string, 'null'], format: uuid}
        '400': {description: Unexpected query parameters}
        '401': {description: Session required}
        '403': {description: Admin role required}
        '503': {description: Identity storage unavailable}
  /admin/ownership/transfer:
    post:
      summary: Current owner transfers ownership to another active admin
      description: >-
        Requires the current owner's own password. Ownership and its audit entry
        commit together. Both accounts keep their existing admin role. The new owner
        gains the protection immediately; the old owner loses it immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_id, password]
              properties:
                user_id: {type: string, format: uuid}
                password: {type: string, format: password, minLength: 1, maxLength: 128, description: Current owner's password; at most 128 UTF-8 bytes.}
      responses:
        '200':
          description: New owner ID; no cookie or credential content.
          content:
            application/json:
              schema: *ownership_response
        '400': {description: Invalid input or self-transfer}
        '401': {description: Session required or account authorization changed during confirmation}
        '403': {description: 'Admin role required, owner_required, invalid_confirmation, or rejected browser origin'}
        '409': {description: 'owner_target_ineligible; target is missing, blocked, or not an admin'}
        '415': {description: Content-Type must be application/json}
        '429': {description: confirmation_rate_limited; Retry-After is supplied}
        '503': {description: Identity storage or password verification temporarily unavailable}
  /incidents/{id}/ai-feedback:
    post:
      summary: Record human review of a real AI assessment and optionally confirm category
      description: |
        Assigned analyst or admin only. The job must have a stored real (non-fixture)
        result for this incident. At most one feedback decision per job. An accepted
        category must match the stored suggestion. Accepted/corrected decisions update
        the human-confirmed incident category in the same transaction as audit history;
        rejected decisions leave the incident unchanged. Reasons are mandatory for
        corrected/rejected decisions. Category and decision are recorded in history;
        model output is never automatically trusted.
      parameters: *incident_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [job_id, decision, category, reason]
              properties:
                job_id: {type: string, format: uuid}
                decision: {type: string, enum: [accepted, corrected, rejected]}
                category:
                  type: [string, 'null']
                  enum: [phishing, malware, account_compromise, data_exposure, lost_device, policy_violation, service_disruption, other, null]
                reason: {type: string, maxLength: 2000}
      responses:
        '201': {description: Human AI review saved and incident category confirmed when applicable}
        '400': {description: Invalid decision or category}
        '403': {description: Assigned analyst or admin required}
        '404': {description: Incident or assessment unavailable}
        '409': {description: 'Duplicate review, terminal incident or synthetic fixture'}
  /incidents/{id}/ai-feedback/{job_id}:
    get:
      summary: Read the persisted human review for a stored assessment
      description: Current analysts and admins may read reviews on visible, non-archived incidents regardless of assignment or terminal status.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: job_id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Review of this job, or null if its result has not been reviewed
          content:
            application/json:
              schema:
                type: object
                required: [review]
                properties:
                  review:
                    type: [object, 'null']
                    required: [job_id, decision, category, reason]
                    properties:
                      job_id: {type: string, format: uuid}
                      decision: {type: string, enum: [accepted, corrected, rejected]}
                      category:
                        enum: [phishing, malware, account_compromise, data_exposure, lost_device, policy_violation, service_disruption, other, null]
                      reason: {type: string, maxLength: 2000}
        '400': {description: Unexpected query parameters}
        '401': {description: Session required}
        '403': {description: Professional role required}
        '404': {description: 'Missing or archived incident, or no matching stored result'}
  /notifications/{id}/unread:
    post:
      summary: Mark an own notification as unread
      description: Only the current recipient may reset its read timestamp.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Unread timestamp cleared}
        '404': {description: Not the user's notification or missing}
