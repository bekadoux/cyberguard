# Test-only overlay: real Go/PostgreSQL/Python/Caddy, synthetic model HTTP servers.
services:
  incident-db:
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        cp /test-certs/db.crt /tls/server.crt;
        cp /test-certs/db.key /tls/server.key;
        chown postgres:postgres /tls/server.crt /tls/server.key;
        chmod 0600 /tls/server.key;
        exec /usr/local/bin/docker-entrypoint.sh postgres -c ssl=on
        -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tls/server.key
    volumes:
      - ${AI_TEST_DIR}/certs:/test-certs:ro
    tmpfs: ['/tls:size=1m,mode=0755']
    networks: [incidents, services]
  go-api:
    environment:
      AI_INTERNAL_TOKEN_FILE: /run/secrets/ai_internal_token
    secrets: [identity_runtime_url, incidents_runtime_url, ai_internal_token]
  app-tls:
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    command: [caddy, run, --config, /fixture/Caddyfile, --adapter, caddyfile]
    volumes:
      - ${AI_TEST_DIR}/certs:/test-certs:ro
      - ${AI_TEST_DIR}/AppCaddyfile:/fixture/Caddyfile:ro
    networks: [edge, services]
  ai-api:
    volumes:
      - ./deploy/ai-vm/tests/client.py:/fixture/client.py:ro
      - ${AI_TEST_DIR}/secrets/dev_employee_a_password:/fixture/employee-password:ro
      - ${AI_TEST_DIR}/secrets/dev_analyst_password:/fixture/analyst-password:ro
  ai-kev:
    image: ${AI_IMAGE}
    command: [python, /fixture/fixtures.py, kev, '8009']
    volumes:
      - ./deploy/ai-vm/tests/fixtures.py:/fixture/fixtures.py:ro
      - ${AI_TEST_DIR}/control:/control:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8009/v1/models', timeout=3).read()"]
      interval: 1s
      start_period: 0s
      retries: 3
  ai-llm:
    image: ${AI_IMAGE}
    command: [python, /fixture/fixtures.py, llm, '8081']
    volumes:
      - ./deploy/ai-vm/tests/fixtures.py:/fixture/fixtures.py:ro
      - ${AI_TEST_DIR}/control:/control:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3).read()"]
      interval: 1s
      start_period: 0s
      retries: 3
  bootstrap-ai:
    image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    profiles: [tools]
    entrypoint: [/bin/sh, /setup/bootstrap-ai.sh]
    secrets: [incidents_admin_password, ai_runtime_password]
    volumes:
      - ./docker/ai/bootstrap-ai.sh:/setup/bootstrap-ai.sh:ro
      - ./db/bootstrap/ai-worker.sql:/setup/ai-worker.sql:ro
    networks: [incidents]

secrets:
  ai_runtime_password:
    file: ${AI_TEST_DIR}/secrets/ai_runtime_password
