version: "2"
sql:
  - engine: postgresql
    schema: ../../db/migrations/identity
    queries: sql/identity
    gen:
      go:
        package: identity
        out: internal/db/identity
        sql_package: pgx/v5
        emit_empty_slices: true
  - engine: postgresql
    schema: ../../db/migrations/incidents
    queries: sql/incidents
    gen:
      go:
        package: incidents
        out: internal/db/incidents
        sql_package: pgx/v5
        emit_empty_slices: true
